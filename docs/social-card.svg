<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <defs>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <clipPath id="windowClip">
      <rect x="1" y="1" width="1198" height="628" rx="22" ry="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#windowClip)">
    <rect x="0" y="0" width="1200" height="630" fill="#0a0e17"/>
    <circle cx="160" cy="60" r="280" fill="url(#glow1)"/>
    <circle cx="1060" cy="580" r="300" fill="url(#glow2)"/>
    <rect x="0" y="0" width="1200" height="630" fill="url(#dots)"/>
    <rect x="0" y="0" width="1200" height="52" fill="#11151f"/>
    <line x1="0" y1="52" x2="1200" y2="52" stroke="#1e2330" stroke-width="1"/>

    <circle cx="32" cy="26" r="7" fill="#ff5f57"/>
    <circle cx="56" cy="26" r="7" fill="#febc2e"/>
    <circle cx="80" cy="26" r="7" fill="#28c840"/>
    <text x="600" y="31" font-size="14" fill="#5b6472" text-anchor="middle">alice@mac ~ sgpg</text>

    <!-- lock icon, centered -->
    <g transform="translate(536,108)">
      <path d="M14 40 V26 a20 20 0 0 1 40 0 V40" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>
      <rect x="2" y="40" width="60" height="46" rx="10" fill="url(#accentGrad)"/>
      <circle cx="32" cy="60" r="6" fill="#0a0e17"/>
      <rect x="28" y="64.5" width="8" height="15" rx="2.5" fill="#0a0e17"/>
    </g>

    <!-- wordmark, centered -->
    <text x="600" y="270" font-size="84" font-weight="700" fill="#f5f7fa" text-anchor="middle">sgpg</text>
    <rect x="722" y="203" width="26" height="68" fill="url(#accentGrad)">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>

    <text x="600" y="312" font-size="24" fill="#8b93a7" text-anchor="middle">GPG-encrypted messaging over Signal.</text>
    <text x="600" y="342" font-size="17" fill="#525a68" text-anchor="middle">GPG owns keys and cryptography. Signal is transport only.</text>

    <!-- terminal demo -->
    <text x="600" y="404" font-size="19" fill="#c9d1d9" text-anchor="middle"><tspan fill="#38bdf8">$</tspan> echo &quot;ship it&quot; | sgpg send alice</text>
    <text x="600" y="432" font-size="19" fill="#34d399" text-anchor="middle">✓ sent to alice</text>

    <!-- security model chips -->
    <g font-size="15" fill="#c9d1d9">
      <rect x="217" y="472" width="222" height="42" rx="21" fill="#11151f" stroke="#232838"/>
      <text x="238" y="499"><tspan fill="#34d399">✓</tspan> Keys stay in GPG</text>

      <rect x="459" y="472" width="282" height="42" rx="21" fill="#11151f" stroke="#232838"/>
      <text x="480" y="499"><tspan fill="#34d399">✓</tspan> Plaintext never on disk</text>

      <rect x="761" y="472" width="222" height="42" rx="21" fill="#11151f" stroke="#232838"/>
      <text x="782" y="499"><tspan fill="#34d399">✓</tspan> Only trusted crypto</text>
    </g>

    <line x1="440" y1="558" x2="760" y2="558" stroke="#1e2330" stroke-width="1"/>
    <text x="600" y="590" font-size="17" fill="#6b7280" text-anchor="middle">pip install sgpg  ·  github.com/dtaivpp/sgpg</text>
  </g>

  <rect x="1" y="1" width="1198" height="628" rx="22" ry="22" fill="none" stroke="#232838" stroke-width="1.5"/>
</svg>
