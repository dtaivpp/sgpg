[project]
name = "sgpg"
version = "0.1.0"
description = "GPG-encrypted messaging over Signal. GPG owns keys and crypto; Signal is transport only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.58",
    "tomlkit>=0.13",
]

[project.scripts]
sgpg = "sgpg.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sgpg"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "S", "A", "C4", "SIM", "RUF", "N", "PL",
]
ignore = [
    "PLR0913", # too many arguments — CLI commands legitimately take many options
    "PLR0917", # too many positional arguments — same reason, for Typer callbacks
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603", "S607", "PLR2004"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src"]

[[tool.mypy.overrides]]
module = "tomlkit.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
source = ["src/sgpg"]
branch = true
