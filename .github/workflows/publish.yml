name: Publish to PyPI

# Cutting a GitHub Release (or a manual run, for a dry-run build without
# publishing) is what ships a new version. Every action is pinned to a
# commit SHA rather than a mutable tag -- this workflow ends up holding
# PyPI publish credentials via OIDC, so a compromised/hijacked tag on any
# of these actions must not be able to run arbitrary code here.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"

      - name: Check pyproject.toml version matches the release tag
        if: github.event_name == 'release'
        run: |
          pyproject_version=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pyproject_version" != "$tag_version" ]; then
            echo "::error::pyproject.toml version ($pyproject_version) does not match release tag ($tag_version)"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    # Only publish on an actual release; workflow_dispatch just builds
    # and tests, so you can dry-run the pipeline without shipping anything.
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sgpg/
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC) -- no API token needed
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # Not SHA-pinned like the rest of this workflow: this action runs as
        # a Docker container whose image tag is resolved from the git ref,
        # and GHCR only has images published for release tags, not arbitrary
        # commit SHAs -- pinning to a SHA here 404s on `docker pull`.
        # release/v1 is PyPA's own officially-documented floating ref for it.
        uses: pypa/gh-action-pypi-publish@release/v1
